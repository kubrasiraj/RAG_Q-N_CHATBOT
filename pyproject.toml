[project]
name = "qna-rag-chatbot"
version = "0.1.0"
description = ""
authors = [
    {name = "Kubra Siraj",email = "kubrasiraj267@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "sqlalchemy (>=2.1.8,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "psycopg[binary] (>=3.3.8,<4.0.0)",
    "pgvector (>=0.5.1,<0.6.0)",
    "python-multipart (>=0.0.33,<0.0.34)",
    "pymupdf (>=2.1,<3.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "sentence-transformers (>=6.2.0,<7.0.0)",
    "transformers (>=5.22.1,<6.0.0)",
    "groq (>=1.7.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
